name: PR review

# Automated code review by Claude on every non-draft PR, plus on-demand help
# when someone writes "@claude" in a PR comment.
#
# Setup (once): install the Claude GitHub App (https://github.com/apps/claude)
# on this repo and add ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN) under
# Settings → Secrets and variables → Actions. Without a secret the jobs skip.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: pr-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  review:
    name: Claude review
    # Skip drafts, and PRs from forks (secrets are not available to them).
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: No API key configured
        if: env.HAS_KEY != 'true'
        run: echo "::notice::Skipping Claude review. Add ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN to repo secrets to enable it."

      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: env.HAS_KEY == 'true'
        with:
          node-version: 22

      - uses: anthropics/claude-code-action@v1
        if: env.HAS_KEY == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request to MCSS-Lite, a contract-first CSS design
            system. Read AGENTS.md and _memory.md first: they hold the rules and the
            approved decisions. Then read the diff with `gh pr diff`.

            Run `npm test`, `npm run check` and `node bin/mcss-lite.mjs validate components demo`
            and use their output as evidence. CI runs them too; do not repeat what they
            already report verbatim, explain the cause instead.

            Review for, in order of importance:
            1. Correctness bugs in scripts/ and bin/ (the build, check, validator, Figma script).
            2. Source-of-truth violations: tokens/*.tokens.json and components/*.json are the
               source. AGENTS.md, llms*.txt, src/tokens.css, dist/ are generated by
               `npm run build` and must not be hand-edited. A class in src/*.css needs a contract.
            3. Design-system rules from AGENTS.md: no outer margin on c-* roots; states use
               data-state plus the paired native/ARIA attribute; no raw colors or pixel spacing
               in src/*.css; components never use primitive color tokens; component tokens are
               written var(--component-token, var(--semantic-token)).
            4. Back-compat: every 0.1.0 token and class name is kept (renames need a deprecation,
               not a removal). Breaking changes need a version bump in package.json.
            5. Accessibility: WCAG 2.2 AA in light and dark themes, visible focus, forced-colors,
               keyboard use of the modal.
            6. No account-specific IDs (Figma file keys, team IDs) in shipped files.

            Post line-specific findings with mcp__github_inline_comment__create_inline_comment,
            only for real problems, each with the concrete failure and a fix. Skip style nits the
            code already disagrees with. Finish with one `gh pr comment` summary: a verdict
            (looks good / needs changes), the check results, and the findings ranked by severity.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(npm test),Bash(npm run check),Bash(npm run build),Bash(node bin/mcss-lite.mjs validate:*),Bash(git diff:*),Bash(git log:*)"

  assist:
    name: Claude on request
    # "@claude ..." in a PR or issue comment, from people with write access.
    if: >-
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: >-
            --allowedTools "Bash(npm test),Bash(npm run check),Bash(npm run build),Bash(node bin/mcss-lite.mjs validate:*)"
