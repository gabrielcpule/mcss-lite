name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The full gate, on the current LTS. Problem matchers turn check and
  # validate output into inline annotations on the PR's "Files changed" tab.
  checks:
    name: Contracts, tokens and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: echo "::add-matcher::.github/matchers/mcss-lite.json"

      - name: Tests (back-compat, WCAG contrast, validator, build)
        run: npm test

      - name: Contracts, CSS and tokens agree; generated files are fresh
        run: npm run check

      - name: Canonical examples and demo validate
        run: node bin/mcss-lite.mjs validate components demo

      - name: Package contents
        run: npm run check:package

  # Runs the tests on every Node version package.json supports.
  compat:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run check
