  <!-- PROTOTYPE (throwaway, branch prototype/landing-look): three landing-page variants on one route,
       switchable with ?variant=A–I, the floating bar below, or the arrow keys. Not part of the build. -->
  <div id="main-slot"><p class="proto-loading">Loading variant…</p></div>

  <nav class="proto-switcher" aria-label="Prototype variants">
    <button type="button" class="proto-switcher__arrow" data-step="-1" aria-label="Previous variant">&larr;</button>
    <p class="proto-switcher__label" aria-live="polite"></p>
    <button type="button" class="proto-switcher__arrow" data-step="1" aria-label="Next variant">&rarr;</button>
  </nav>

  <script>
  (() => {
    const VARIANTS = [
      { key: 'A', name: 'The box cover', file: 'variant-a.html' },
      { key: 'B', name: 'Fit test first', file: 'variant-b.html' },
      { key: 'C', name: 'The booklet spread', file: 'variant-c.html' },
      { key: 'D', name: 'The sorting tray', file: 'variant-d.html' },
      { key: 'E', name: 'One build, page by page', file: 'variant-e.html' },
      { key: 'F', name: 'Exploded view (design-taste-frontend)', file: 'variant-f.html' },
      { key: 'G', name: 'Built from its own parts (design-superpowers:design)', file: 'variant-g.html' },
      { key: 'H', name: 'Laid in courses (design-superpowers:creative)', file: 'variant-h.html' },
      { key: 'I', name: 'Hands-on booklet (design-skills:interaction-design)', file: 'variant-i.html' },
    ];
    const params = new URLSearchParams(location.search);
    const idx = Math.max(0, VARIANTS.findIndex((v) => v.key === (params.get('variant') || 'A').toUpperCase()));
    const current = VARIANTS[idx];
    document.querySelector('.proto-switcher__label').textContent = `${current.key} (${current.name}) · ${idx + 1}/${VARIANTS.length}`;
    const go = (step) => {
      const next = VARIANTS[(idx + step + VARIANTS.length) % VARIANTS.length];
      params.set('variant', next.key);
      location.search = params.toString();
    };
    document.querySelectorAll('.proto-switcher__arrow').forEach((b) => b.addEventListener('click', () => go(Number(b.dataset.step))));
    document.addEventListener('keydown', (e) => {
      if (e.target.closest('input, textarea, select, [contenteditable]')) return;
      if (e.key === 'ArrowLeft') go(-1);
      if (e.key === 'ArrowRight') go(1);
    });
    fetch(current.file).then((r) => r.text()).then((html) => {
      document.getElementById('main-slot').outerHTML = html;
      console.log('[prototype] variant', current.key, current.name);
      const s = document.createElement('script'); s.src = '../demo.js'; document.body.appendChild(s);
    });
  })();
  </script>
