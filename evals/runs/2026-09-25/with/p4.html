<section class="l-section">
  <div class="l-container">
    <div class="l-stack l-stack--lg">
      <h1 class="u-margin-0">Settings</h1>

      <div class="l-sidebar">
        <nav class="l-sidebar__sidebar" aria-label="Settings">
          <ul class="l-stack l-stack--sm u-margin-0 u-padding-0" role="list">
            <li><a href="#profile" aria-current="page">Profile</a></li>
            <li><a href="#notifications">Notifications</a></li>
            <li><a href="#security">Security</a></li>
            <li><a href="#billing">Billing</a></li>
          </ul>
        </nav>

        <main class="l-sidebar__content">
          <div class="l-stack">
            <section class="c-card" id="profile" aria-labelledby="profile-title">
              <header class="c-card__header">
                <h2 class="c-card__title" id="profile-title">Profile</h2>
              </header>
              <div class="c-card__body">
                <p class="u-margin-0">Your name, photo and the email address people see.</p>
              </div>
              <footer class="c-card__footer">
                <div class="l-cluster">
                  <button type="button" class="c-button c-button--sm">Edit profile</button>
                </div>
              </footer>
            </section>

            <section class="c-card" id="notifications" aria-labelledby="notifications-title">
              <header class="c-card__header">
                <h2 class="c-card__title" id="notifications-title">Notifications</h2>
              </header>
              <div class="c-card__body">
                <p class="u-margin-0">Choose which emails and alerts you receive.</p>
              </div>
              <footer class="c-card__footer">
                <div class="l-cluster">
                  <button type="button" class="c-button c-button--sm">Manage notifications</button>
                </div>
              </footer>
            </section>
          </div>
        </main>
      </div>
    </div>
  </div>
</section>
