<section class="l-section">
  <div class="l-container">
    <div class="l-stack l-stack--lg">
      <h2>Pricing</h2>
      <div class="l-grid l-grid--3-col l-grid--responsive">
        <article class="c-card c-card--bordered">
          <header class="c-card__header">
            <h3 class="c-card__title">Free</h3>
          </header>
          <div class="c-card__body l-stack l-stack--sm">
            <p>$0 / month</p>
            <ul>
              <li>1 project</li>
              <li>Community support</li>
              <li>1 GB storage</li>
            </ul>
          </div>
          <footer class="c-card__footer">
            <a class="c-button c-button--secondary" href="/signup?plan=free">Get started</a>
          </footer>
        </article>
        <article class="c-card c-card--elevated" aria-labelledby="plan-pro">
          <header class="c-card__header l-cluster">
            <h3 class="c-card__title" id="plan-pro">Pro</h3>
            <span class="c-badge c-badge--primary">Recommended</span>
          </header>
          <div class="c-card__body l-stack l-stack--sm">
            <p>$19 / month</p>
            <ul>
              <li>Unlimited projects</li>
              <li>Email support</li>
              <li>50 GB storage</li>
            </ul>
          </div>
          <footer class="c-card__footer">
            <a class="c-button c-button--primary" href="/signup?plan=pro">Start Pro trial</a>
          </footer>
        </article>
        <article class="c-card c-card--bordered">
          <header class="c-card__header">
            <h3 class="c-card__title">Team</h3>
          </header>
          <div class="c-card__body l-stack l-stack--sm">
            <p>$49 / month</p>
            <ul>
              <li>Everything in Pro</li>
              <li>Up to 10 seats</li>
              <li>Priority support</li>
            </ul>
          </div>
          <footer class="c-card__footer">
            <a class="c-button c-button--secondary" href="/contact-sales">Contact sales</a>
          </footer>
        </article>
      </div>
    </div>
  </div>
</section>
