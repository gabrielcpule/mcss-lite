# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit review settings. AGENTS.md holds the design-system rules; the
# path instructions below add what a reviewer needs beyond that file.
language: en-US

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  in_progress_fortune: false
  sequence_diagrams: false
  review_status: true
  collapse_walkthrough: true
  assess_linked_issues: true

  auto_review:
    enabled: true
    drafts: false
    ignore_title_keywords: ["WIP", "[skip review]"]

  # Generated by `npm run build`. CI fails when they are stale, so reviewing
  # them only repeats the source diff.
  path_filters:
    - "!dist/**"
    - "!src/tokens.css"
    - "!AGENTS.md"
    - "!llms*.txt"

  path_instructions:
    - path: "tokens/**/*.tokens.json"
      instructions: |
        Source of truth for tokens (DTCG 2025.10). Three tiers: primitive, semantic
        (light and dark files must define the same names), component (unset by default,
        aliasing a semantic token). Flag: a removed or renamed token without a deprecation
        entry (every 0.1.0 name must keep working); a semantic light value with no dark
        counterpart; text/background pairs likely to fall below WCAG 2.2 AA (4.5:1 text,
        3:1 borders and focus rings) in either theme.
    - path: "components/*.json"
      instructions: |
        Component contracts (schemas/component.schema.json). Flag: removed blocks,
        modifiers, elements or states (deprecate with "replacement" instead); a state
        without its paired native/ARIA attribute (disabled, aria-invalid, aria-busy);
        modifiers that belong to one group but are not declared mutually exclusive.
    - path: "components/*.html"
      instructions: |
        Canonical examples shown to AI agents; they must be exemplary. Components inside
        layout primitives, no margin on c-* roots, only classes and states from the
        contracts, accessible names on every control.
    - path: "src/*.css"
      instructions: |
        Hand-written CSS in cascade layers (global, layout, component, utility). Flag: raw
        colors or pixel spacing (use tokens); primitive color tokens in components (they
        do not adapt to dark mode); component tokens not written as
        var(--component-token, var(--semantic-token)); margin on a c-* root; missing
        :focus-visible or forced-colors handling on interactive parts; motion without a
        prefers-reduced-motion guard.
    - path: "{scripts,bin}/**/*.mjs"
      instructions: |
        Zero-dependency Node >= 18 tooling (build, check, validator, Figma script). Focus on
        correctness: regex edge cases in the validator, cross-platform paths, exit codes
        (validate exits 1 on errors, 2 on usage errors), and generated output that would
        differ between runs.
    - path: "test/**"
      instructions: |
        node:test suites. Flag weakened or deleted assertions, especially the back-compat
        and contrast tests.
    - path: "demo/**"
      instructions: |
        Instruction-booklet demo, generated from demo/steps.json and the contract examples.
        Check both themes and keyboard use. It is mirrored to gabrielpule.work, so flag
        account-specific IDs or secrets.
    - path: ".github/**"
      instructions: |
        CI and review workflows. Flag broad token permissions, secrets exposed to fork
        PRs, and unpinned third-party actions.

  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: warning
    description:
      mode: warning
    # Hand-edited generated files are caught by `npm run check` in CI.
    custom_checks:
      - name: "No account-specific IDs"
        mode: error
        instructions: |
          Fail if the diff adds a Figma file key, Figma team or project ID, API key or
          access token to any file. Otherwise pass.

  tools:
    actionlint:
      enabled: true
    gitleaks:
      enabled: true
    markdownlint:
      enabled: true
    yamllint:
      enabled: true
    biome:
      enabled: true
    # Stylelint's default rules disagree with the repo's own CSS conventions;
    # `npm run check` is the CSS gate.
    stylelint:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "_memory.md"
      - "DESIGN.md"
  # "auto" turns Linear off for public repos, so enable it explicitly.
  linear:
    usage: enabled
